<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Estoque - Simonetti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/admin_vitrine.css">
</head>
<body>

<nav class="top-nav">
    <div class="nav-left">
        <a href="admin_painel.html" class="btn-voltar" title="Voltar ao Painel"><i class="fas fa-arrow-left"></i></a>
        <i class="fas fa-user-circle" style="color: var(--accent);"></i>
        <span><b><span id="navNome">...</span></b> | <small id="navUnidade">...</small></span>
    </div>
    <div class="nav-center">TRANSBORDO 600</div>
    <div class="nav-right">
        <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
    </div>
</nav>

<div class="container">
    <div class="summary-grid">
        <div class="card-resumo">
            <small>Total de Produtos</small>
            <h2 id="totalVolumes">0</h2>
        </div>
        <div class="card-resumo" style="border-left-color: var(--success);">
            <small>VALOR TOTAL EM ESTOQUE</small>
            <h2 id="totalFinanceiro">R$ 0,00</h2>
        </div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="🔍 Buscar produto ou código..." onkeyup="filtrar()">
        </div>
        <div class="filter-box">
            <select id="selectForn" onchange="filtrar()">
                <option value="">Todos Fornecedores</option>
            </select>
        </div>
        <div class="export-box">
            <button class="btn-export btn-excel" onclick="exportarExcel()">
                <i class="fas fa-file-excel"></i> EXCEL
            </button>
            <button class="btn-export btn-pdf" onclick="exportarPDF()">
                <i class="fas fa-file-pdf"></i> PDF
            </button>
        </div>
    </div>
    
    <div class="grid-produtos" id="vitrine"></div>
</div>

<script type="module" src="js/admin_vitrine.js"></script>
</body>
</html>
