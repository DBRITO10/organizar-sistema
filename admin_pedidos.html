<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM - Gestão de Pedidos Simonetti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_pedidos.css">
</head>
<body>

<nav class="top-nav" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
    <div class="nav-esquerda" style="display: flex; align-items: center; gap: 15px;">
        <a href="admin_painel.html" class="btn-voltar" style="font-size: 1.2rem; text-decoration: none; color: var(--primary);">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div style="line-height: 1.1;">
            <div style="font-size: 0.9rem; font-weight: bold;">
                <i class="fas fa-user-shield" style="color:var(--accent)"></i> <span id="nomeAdmin">...</span>
            </div>
            <small style="font-size: 0.7rem; color: var(--text-light);">Assistência MS</small>
        </div>
    </div>
    <div class="nav-direita">
        <a href="#" id="btnLogout" class="btn-sair">SAIR <i class="fas fa-sign-out-alt"></i></a>
    </div>
</nav>

<div class="container">
    <h1 class="titulo-pagina">Gestão de Pedidos Simonetti</h1>
    
    <div class="busca-container">
        <input type="text" id="campoBusca" class="input-busca" placeholder="🔍 Buscar Loja, Gerente ou Produto..." onkeyup="filtrarPedidos()">
    </div>

    <section>
        <h2 style="color: var(--pendente);"><i class="fas fa-clock"></i> Pendentes</h2>
        <div id="listaPendentes"></div>
    </section>

    <div class="filtro-data-container">
        <span><strong>Filtrar Histórico:</strong></span>
        <input type="date" id="dataInicio">
        <span>até</span>
        <input type="date" id="dataFim">
        <button onclick="carregarPedidos()" class="btn-pdf" style="padding: 8px 15px; background: var(--primary); border:none;">Filtrar</button>
    </div>

    <section>
        <h2 style="color: var(--concluido);"><i class="fas fa-check-double"></i> Concluídos</h2>
        <div id="listaConcluidos"></div>
    </section>
</div>

<script type="module" src="js/admin_pedidos.js"></script>
</body>
</html>
