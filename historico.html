<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Giro - Móveis Simonetti</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/historico.css">
</head>
<body>

  <nav class="top-nav">
    <div class="nav-left">
      <a href="pagina.html"><i class="fas fa-arrow-left"></i></a>
      <h1>Histórico de Movimentações</h1>
    </div>
    
    <div class="nav-right">
        <div class="user-badge" id="labelUser"><i class="fas fa-user-circle"></i> Carregando...</div>
        <button id="btnLogout" class="btn-nav" style="background: var(--danger);"><i class="fas fa-sign-out-alt"></i> SAIR</button>
    </div>
  </nav>

  <div class="container">
    <div class="glass-panel">
      <div class="filter-grid">
        <div class="filter-group">
          <label>DATA INÍCIO:</label>
          <input type="date" id="filtroDataInicio">
        </div>
        <div class="filter-group">
          <label>DATA FIM:</label>
          <input type="date" id="filtroDataFim">
        </div>
        <div class="filter-group" style="flex-grow: 1;">
          <label>BUSCAR (PRODUTO, SKU OU AÇÃO):</label>
          <input type="text" id="inputBusca" placeholder="Ex: Lateral Direita ou Entrada...">
        </div>
        <button id="btnLimpar" class="btn-nav" style="background: var(--primary); height: 40px; align-self: flex-end;">LIMPAR</button>
      </div>
    </div>

    <div class="glass-panel" style="padding: 0; overflow: hidden;">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 180px;">DATA / HORA</th>
              <th style="width: 150px;">OPERADOR</th>
              <th>DESCRIÇÃO DO EVENTO</th>
              <th style="width: 80px;">QTD</th>
            </tr>
          </thead>
          <tbody id="tabelaHist"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="js/historico.js"></script>
</body>
</html>
