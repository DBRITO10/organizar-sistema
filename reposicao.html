<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Alertas - Móveis Simonetti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/produtos.css">
    <style>
        .alerta-vermelho { background-color: #ffebee !important; color: #b71c1c; font-weight: bold; border-left: 4px solid #b71c1c; }
        .input-alerta { width: 70px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .btn-save-alerta { background: #2e7d32; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .btn-save-alerta:hover { background: #1b5e20; }
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; }
        .input-busca { flex-grow: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
        td small { display: block; color: #666; font-size: 0.75rem; }
        .btn-export { padding: 10px 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="pagina.html" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold; letter-spacing:1px;">PAINEL DE REPOSIÇÃO</span>
        </div>
        
        <div class="user-info">
            <div id="userDisplay"><i class="fas fa-user-circle"></i> Carregando...</div>
            <button id="btnLogout" class="btn-action" style="background:var(--danger); padding: 5px 12px;">SAIR</button>
        </div>
    </nav>

    <div class="container">
        <div class="glass-panel search-container">
            <i class="fas fa-search" style="align-self: center; color: var(--primary);"></i>
            <input type="text" id="inputBusca" class="input-busca" placeholder="Buscar por Fornecedor, Produto, Código ou Volume..." oninput="window.filtrarTabela()">
            
            <button onclick="window.exportarExcel()" class="btn-export" style="background: #1f6f43;">
                <i class="fas fa-file-excel"></i> EXCEL
            </button>
            <button onclick="window.gerarPDF()" class="btn-export" style="background: #b71c1c;">
                <i class="fas fa-file-pdf"></i> PDF
            </button>
        </div>

        <div class="glass-panel" style="padding:0; overflow-x: auto;">
            <table id="tblReposicao">
                <thead>
                    <tr>
                        <th>FORNECEDOR</th>
                        <th>PRODUTO (Mestre)</th>
                        <th>DESCRIÇÃO DO VOLUME</th>
                        <th>CÓD. VOLUME</th>
                        <th style="text-align:center">QTD ATUAL</th>
                        <th>ALERTA (Min)</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="corpoReposicao"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { db, auth } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        let todosDados = [];

        // Verificação de Usuário e Inicialização
        onAuthStateChanged(auth, async user => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const nome = userDoc.exists() ? userDoc.data().nomeCompleto : user.email;
                document.getElementById("userDisplay").innerHTML = `<i class="fas fa-user-circle"></i> ${nome}`;
                carregarInformacoes();
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById("btnLogout").onclick = () => signOut(auth).then(() => window.location.href = "index.html");

        async function carregarInformacoes() {
            try {
                // BUSCA CRUZADA: Volumes + Produtos + Fornecedores
                const [snapVols, snapProds, snapForn] = await Promise.all([
                    getDocs(collection(db, "volumes")),
                    getDocs(collection(db, "produtos")),
                    getDocs(collection(db, "fornecedores"))
                ]);

                // Mapeia fornecedores por ID
                const fornMap = {};
                snapForn.forEach(d => fornMap[d.id] = d.data().nome);

                // Mapeia produtos master por ID
                const prodsMap = {};
                snapProds.forEach(d => {
                    const p = d.data();
                    prodsMap[d.id] = {
                        nome: p.nome,
                        sku: p.codigo,
                        fornecedor: fornMap[p.fornecedorId] || "Não definido"
                    };
                });

                // Monta a lista final cruzando o volume com o seu produto pai
                todosDados = snapVols.docs.map(d => {
                    const vol = d.data();
                    const master = prodsMap[vol.produtoId] || {};
                    
                    return {
                        id: d.id,
                        fornecedor: master.fornecedor || "---",
                        produtoNome: master.nome || "---",
                        produtoSku: master.sku || "---",
                        volDesc: vol.descricao || "---",
                        volCod: vol.codigo || "---",
                        quantidade: Number(vol.quantidade) || 0,
                        estoqueMinimo: Number(vol.estoqueMinimo) || 0
                    };
                });

                renderizar(todosDados);
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        window.renderizar = (dados) => {
            const tbody = document.getElementById("corpoReposicao");
            
            // Ordenação: Itens que precisam de reposição primeiro
            const ordenados = [...dados].sort((a, b) => {
                const aCritico = a.estoqueMinimo > 0 && a.quantidade <= a.estoqueMinimo;
                const bCritico = b.estoqueMinimo > 0 && b.quantidade <= b.estoqueMinimo;
                return bCritico - aCritico;
            });

            tbody.innerHTML = ordenados.map(v => {
                const critico = v.estoqueMinimo > 0 && v.quantidade <= v.estoqueMinimo;
                return `
                    <tr class="${critico ? 'alerta-vermelho' : ''}">
                        <td>${v.fornecedor}</td>
                        <td><strong>${v.produtoNome}</strong><br><small>CÓDIGO: ${v.produtoSku}</small></td>
                        <td>${v.volDesc}</td>
                        <td>${v.volCod}</td>
                        <td style="text-align:center"><strong>${v.quantidade}</strong></td>
                        <td>
                            <div style="display:flex; align-items:center;">
                                <input type="number" id="min-${v.id}" value="${v.estoqueMinimo}" class="input-alerta">
                                <button onclick="window.salvarAlerta('${v.id}')" class="btn-save-alerta" title="Salvar Alerta Individual">
                                    <i class="fas fa-save"></i>
                                </button>
                            </div>
                        </td>
                        <td>${critico ? '⚠️ REPOR' : '✅ OK'}</td>
                    </tr>
                `;
            }).join('');
        };

        window.filtrarTabela = () => {
            const termo = document.getElementById("inputBusca").value.toLowerCase();
            const filtrados = todosDados.filter(v => 
                v.fornecedor.toLowerCase().includes(termo) ||
                v.produtoNome.toLowerCase().includes(termo) ||
                v.volDesc.toLowerCase().includes(termo) ||
                v.volCod.toLowerCase().includes(termo) ||
                v.produtoSku.toLowerCase().includes(termo)
            );
            renderizar(filtrados);
        };

        window.salvarAlerta = async (id) => {
            const novoMinimo = Number(document.getElementById(`min-${id}`).value);
            try {
                await updateDoc(doc(db, "volumes", id), {
                    estoqueMinimo: novoMinimo
                });
                const index = todosDados.findIndex(item => item.id === id);
                if(index !== -1) todosDados[index].estoqueMinimo = novoMinimo;
                alert("Alerta de estoque atualizado com sucesso!");
                renderizar(todosDados);
            } catch (e) {
                alert("Erro ao salvar alerta.");
            }
        };

        // --- FUNÇÕES DE EXPORTAÇÃO ---
        window.exportarExcel = () => {
            const dadosExcel = todosDados.map(item => ({
                "Fornecedor": item.fornecedor,
                "Código": item.produtoSku,
                "Produto Master": item.produtoNome,
                "Cód. Volume": item.volCod,
                "Descrição Volume": item.volDesc,
                "Qtd Atual": item.quantidade,
                "Estoque Mínimo": item.estoqueMinimo,
                "Status": item.quantidade <= item.estoqueMinimo ? "REPOR" : "OK"
            }));
            const ws = XLSX.utils.json_to_sheet(dadosExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reposição de Estoque");
            XLSX.writeFile(wb, "Relatorio_Reposicao_Simonetti.xlsx");
        };

        window.gerarPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4'); // Paisagem para caber todas as colunas
            
            doc.setFontSize(16);
            doc.text("Relatório de Alertas de Reposição - Móveis Simonetti", 14, 15);
            
            const head = [['Fornecedor', 'Código', 'Produto', 'Descrição Volume', 'Cód. Vol', 'Qtd', 'Mín', 'Status']];
            const body = todosDados.map(v => [
                v.fornecedor,v.produtoSku, v.produtoNome, v.volDesc, v.volCod, v.quantidade, v.estoqueMinimo, 
                (v.quantidade <= v.estoqueMinimo ? "REPOR" : "OK")
            ]);

            doc.autoTable({
                head: head,
                body: body,
                startY: 25,
                theme: 'grid',
                headStyles: { fillColor: [211, 47, 47] }, // Vermelho Simonetti
                styles: { fontSize: 8 }
            });

            doc.save("Relatorio_Reposicao.pdf");
        };

    </script>
</body>
</html>
