<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giro Detalhado - Móveis Simonetti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/produtos.css">
    <style>
        .filter-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .date-group { display: flex; gap: 10px; }
        .date-group div { flex: 1; }
        .date-group label { display: block; font-size: 10px; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th { font-size: 10px; padding: 10px; background: #eee; color: #333; text-align: left; }
        td { font-size: 12px; padding: 10px; border-bottom: 1px solid #eee; }
        td strong { display: block; color: #333; }
        td small { color: #666; font-size: 10px; }
        .qtd-badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .entrada { background: #e8f5e9; color: #2e7d32; }
        .saida { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="pagina.html" style="color: white;"><i class="fas fa-arrow-left"></i></a>
            <span style="font-weight:bold;">GIRO DETALHADO POR PERÍODO</span>
        </div>
        <button id="btnExportar" class="btn-action" style="background:var(--success); font-size: 11px;">EXCEL</button>
    </nav>

    <div class="container">
        <div class="glass-panel">
            <div class="filter-section">
                <div class="date-group">
                    <div>
                        <label>INÍCIO</label>
                        <input type="date" id="dataInicio">
                    </div>
                    <div>
                        <label>FIM</label>
                        <input type="date" id="dataFim">
                    </div>
                </div>
                <button class="btn-search" onclick="window.carregarGiroDetalhado()">
                    <i class="fas fa-sync"></i> ATUALIZAR RELATÓRIO
                </button>
            </div>
        </div>

        <div class="glass-panel table-responsive" style="padding:0;">
            <table id="tblGiro">
                <thead>
                    <tr>
                        <th>PRODUTO MASTER (SKU)</th>
                        <th>VOLUME (CÓD)</th>
                        <th>FORNECEDOR</th>
                        <th style="text-align:center">ENTRADAS</th>
                        <th style="text-align:center">SAÍDAS</th>
                    </tr>
                </thead>
                <tbody id="corpoGiro">
                    <tr><td colspan="5" style="text-align:center; padding:20px;">Defina as datas e atualize.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        window.onload = () => {
            const agora = new Date();
            document.getElementById("dataInicio").value = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().split('T')[0];
            document.getElementById("dataFim").value = agora.toISOString().split('T')[0];
            window.carregarGiroDetalhado();
        };

        async function carregarGiroDetalhado() {
            const corpo = document.getElementById("corpoGiro");
            corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> Processando giro...</td></tr>`;

            const dInicio = new Date(document.getElementById("dataInicio").value + "T00:00:00");
            const dFim = new Date(document.getElementById("dataFim").value + "T23:59:59");

            try {
                // 1. Pega todas as movimentações
                const qMov = query(collection(db, "movimentacoes"), orderBy("data", "desc"));
                const snapMov = await getDocs(qMov);
                
                // 2. Pega volumes para ter os códigos e nomes corretos
                const snapVols = await getDocs(collection(db, "volumes"));
                const volsMap = {};
                snapVols.forEach(v => volsMap[v.id] = v.data());

                const resumo = {};

                snapMov.forEach(doc => {
                    const mov = doc.data();
                    const dataMov = mov.data.toDate();

                    if (dataMov >= dInicio && dataMov <= dFim) {
                        // Usamos o SKU ou ID do volume como chave
                        const chave = mov.sku || "sem-sku";
                        
                        if (!resumo[chave]) {
                            resumo[chave] = {
                                produtoMaster: mov.produto || "Não Identificado",
                                volumeDesc: mov.volume || "---",
                                skuMaster: mov.skuMaster || "---",
                                codVol: mov.sku || "---",
                                fornecedor: mov.fornecedor || "---",
                                entradas: 0,
                                saidas: 0
                            };
                        }

                        const qtd = Number(mov.quantidade) || 0;
                        if (mov.tipo === "Entrada") resumo[chave].entradas += qtd;
                        if (mov.tipo === "Saída") resumo[chave].saidas += qtd;
                    }
                });

                const lista = Object.values(resumo).sort((a, b) => b.saidas - a.saidas);

                if (lista.length === 0) {
                    corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">Sem dados no período.</td></tr>`;
                    return;
                }

                corpo.innerHTML = lista.map(item => `
                    <tr>
                        <td><strong>${item.produtoMaster}</strong><small>SKU: ${item.skuMaster}</small></td>
                        <td><strong>${item.volumeDesc}</strong><small>Cód: ${item.codVol}</small></td>
                        <td>${item.fornecedor}</td>
                        <td style="text-align:center"><span class="qtd-badge ${item.entradas > 0 ? 'entrada' : ''}">${item.entradas}</span></td>
                        <td style="text-align:center"><span class="qtd-badge ${item.saidas > 0 ? 'saida' : ''}">${item.saidas}</span></td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error(e);
                corpo.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Erro ao cruzar dados.</td></tr>`;
            }
        }

        window.carregarGiroDetalhado = carregarGiroDetalhado;

        document.getElementById("btnExportar").onclick = () => {
            const ws = XLSX.utils.table_to_sheet(document.getElementById("tblGiro"));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Giro Detalhado");
            XLSX.writeFile(wb, "Giro_Detalhado_Simonetti.xlsx");
        };
    </script>
</body>
</html>
